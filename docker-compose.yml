# For TrueNAS SCALE: Apps > Discover Apps > ⋮ > Install via YAML, then paste this.
# The image is named after this repository. Replace the dataset path below first.
services:
  yt-discord-notifier:
    image: ghcr.io/erosion139/youtube-video-announcement-for-discord-docker:latest
    restart: unless-stopped
    ports:
      - "25599:25599"
    volumes:
      # A dataset owned by the "apps" user (568). Holds the database with your settings.
      - /mnt/YOUR_POOL/apps/yt-discord-notifier:/data
    environment:
      TZ: America/New_York
      # Uncomment to require a login for the web interface (user "admin"):
      # ADMIN_PASSWORD: change-me
